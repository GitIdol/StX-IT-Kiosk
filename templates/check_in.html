<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Xavier High School IT Help Desk Check-In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="fullscreen">
        <img src="{{ url_for('static', filename='st_xavier_logo.png') }}" alt="St. Xavier Logo" class="logo">

        <div id="check-in-view" class="view active">
            <h1>Please Check In By Scanning<br>Your ID Badge On The Reader Below</h1>
            <div class="arrow-down">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <polyline points="19 12 12 19 5 12"/>
                </svg>
            </div>
        </div>

        <div id="success-view" class="view">
            <h1 class="welcome">Welcome <span id="student-name"></span>!</h1>
            <p class="instruction">Please Proceed To The Next<br>Available IT Specialist</p>
        </div>

        <div id="error-view" class="view">
            <h1>Badge Not Recognized</h1>
            <p class="instruction">Please see an IT specialist<br>for help.</p>
        </div>

        <!-- Hidden input to capture RFID scan -->
        <input type="text" id="rfid-input" autocomplete="off" autofocus>
    </div>

    <script>
        const rfidInput = document.getElementById('rfid-input');
        const checkInView = document.getElementById('check-in-view');
        const successView = document.getElementById('success-view');
        const errorView = document.getElementById('error-view');
        const studentName = document.getElementById('student-name');

        let isProcessing = false;

        function showView(view) {
            checkInView.classList.remove('active');
            successView.classList.remove('active');
            errorView.classList.remove('active');
            view.classList.add('active');
        }

        function resetToCheckIn() {
            rfidInput.value = '';
            rfidInput.focus();
            isProcessing = false;
            showView(checkInView);
        }

        function showSuccess(firstname) {
            studentName.textContent = firstname;
            showView(successView);
            setTimeout(resetToCheckIn, 7000);
        }

        function showError() {
            showView(errorView);
            setTimeout(resetToCheckIn, 4000);
        }

        async function processRFID(rfid) {
            if (isProcessing) return;
            isProcessing = true;

            try {
                const response = await fetch('/process_rfid', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rfid: rfid })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(data.firstname);
                } else {
                    showError();
                }
            } catch (error) {
                console.error('Error:', error);
                showError();
            }
        }

        rfidInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const rfid = rfidInput.value.trim();
                if (rfid) {
                    processRFID(rfid);
                }
            }
        });

        rfidInput.addEventListener('change', function() {
            const rfid = rfidInput.value.trim();
            if (rfid) {
                processRFID(rfid);
            }
        });

        setInterval(() => {
            if (document.activeElement !== rfidInput && !isProcessing) {
                rfidInput.focus();
            }
        }, 500);

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.altKey || e.metaKey) {
                e.preventDefault();
            }
        });

        document.addEventListener('contextmenu', e => e.preventDefault());

        resetToCheckIn();
    </script>
</body>
</html>
