<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Xavier High School IT Help Desk Check-In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="{{ url_for('static', filename='st_xavier_logo.png') }}" alt="St. Xavier Logo" class="logo">

            <div id="check-in-view" class="view active">
                <h1>IT Help Desk</h1>
                <p class="instruction">Please scan your ID badge on the reader below</p>
                <div class="scanner-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="2"/>
                        <line x1="7" y1="8" x2="17" y2="8"/>
                        <line x1="7" y1="12" x2="17" y2="12"/>
                        <line x1="7" y1="16" x2="13" y2="16"/>
                    </svg>
                </div>
            </div>

            <div id="success-view" class="view">
                <div class="success-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>
                <h1>Thank You, <span id="student-name"></span>!</h1>
                <p class="instruction">Please wait here. An IT specialist will call your name shortly.</p>
            </div>

            <div id="error-view" class="view">
                <div class="error-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </div>
                <h1>Oops!</h1>
                <p class="instruction" id="error-message">Something went wrong. Please try again.</p>
            </div>

            <!-- Hidden input to capture RFID scan -->
            <input type="text" id="rfid-input" autocomplete="off" autofocus>
        </div>
    </div>

    <script>
        const rfidInput = document.getElementById('rfid-input');
        const checkInView = document.getElementById('check-in-view');
        const successView = document.getElementById('success-view');
        const errorView = document.getElementById('error-view');
        const studentName = document.getElementById('student-name');
        const errorMessage = document.getElementById('error-message');

        let isProcessing = false;

        function showView(view) {
            checkInView.classList.remove('active');
            successView.classList.remove('active');
            errorView.classList.remove('active');
            view.classList.add('active');
        }

        function resetToCheckIn() {
            rfidInput.value = '';
            rfidInput.focus();
            isProcessing = false;
            showView(checkInView);
        }

        function showSuccess(firstname) {
            studentName.textContent = firstname;
            showView(successView);
            setTimeout(resetToCheckIn, 5000);
        }

        function showError(message) {
            errorMessage.textContent = message || 'Something went wrong. Please try again.';
            showView(errorView);
            setTimeout(resetToCheckIn, 4000);
        }

        async function processRFID(rfid) {
            if (isProcessing) return;
            isProcessing = true;

            try {
                const response = await fetch('/process_rfid', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rfid: rfid })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(data.firstname);
                } else {
                    showError(data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Connection error. Please try again.');
            }
        }

        // Handle RFID scan (triggered by Enter key from scanner)
        rfidInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const rfid = rfidInput.value.trim();
                if (rfid) {
                    processRFID(rfid);
                }
            }
        });

        // Also handle change event as backup
        rfidInput.addEventListener('change', function() {
            const rfid = rfidInput.value.trim();
            if (rfid) {
                processRFID(rfid);
            }
        });

        // Keep focus on input
        setInterval(() => {
            if (document.activeElement !== rfidInput && !isProcessing) {
                rfidInput.focus();
            }
        }, 500);

        // Prevent keyboard shortcuts in kiosk mode
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.altKey || e.metaKey) {
                e.preventDefault();
            }
        });

        // Prevent right-click
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Initialize
        resetToCheckIn();
    </script>
</body>
</html>
