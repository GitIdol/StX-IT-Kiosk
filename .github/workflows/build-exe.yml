# =============================================================================
# GitHub Actions Workflow: Build Windows EXE
# =============================================================================
#
# WHAT THIS DOES:
#   Automatically builds the kiosk app into a standalone Windows .exe file
#   and creates a GitHub Release with the exe attached for download.
#
# WHEN IT RUNS:
#   - When you push a version tag (e.g., git tag v2.4 && git push origin v2.4)
#   - Manually from the GitHub Actions tab (workflow_dispatch)
#   - It does NOT run on regular code pushes (git push origin main)
#
# WHAT IT PRODUCES:
#   - Kiosk_App.exe — the standalone Windows app (no Python needed)
#   - .env.template — blank config template for first-time setup
#   Both are attached to the GitHub Release for easy download.
#
# HOW TO USE:
#   1. Make your code changes and push to main
#   2. When ready to release: git tag v2.x && git push origin v2.x
#   3. Wait for the build (check the Actions tab for status)
#   4. Download the new exe from the Releases page
#   5. Replace the exe on the kiosk PC and reboot
# =============================================================================

name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v2.0, v2.1, etc.
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

# The workflow needs write access to create releases and upload files
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python 3.10 (matches the version used in development)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install the app's dependencies + PyInstaller (the exe builder)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Step 4: Build the standalone exe using PyInstaller
      # --onefile: everything in a single .exe file
      # --add-data: includes the templates and static folders inside the exe
      - name: Build EXE
        run: |
          pyinstaller --onefile --add-data "templates;templates" --add-data "static;static" --name Kiosk_App app.py

      # Step 5: Collect the files that should be downloadable
      - name: Create deployment package
        run: |
          mkdir deploy
          copy dist\Kiosk_App.exe deploy\
          copy .env.template deploy\
          copy README.md deploy\

      # Step 6: Upload the build as a GitHub artifact (available even without a tag)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiosk_App
          path: deploy/

      # Step 7: Create a GitHub Release with downloadable files (only on tag push)
      # The 'if' condition means this step is skipped for manual/non-tag runs
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kiosk_App.exe
            .env.template
          generate_release_notes: true
          body: |
            ## Installation
            1. Download `Kiosk_App.exe` and `.env.template`
            2. Rename `.env.template` to `.env`
            3. Edit `.env` with your credentials
            4. Run `Kiosk_App.exe`
