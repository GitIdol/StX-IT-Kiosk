name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v2.0, v2.1, etc.
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --add-data "templates;templates" --add-data "static;static" --name Kiosk_App app.py

      - name: Create deployment package
        run: |
          mkdir deploy
          copy dist\Kiosk_App.exe deploy\
          copy .env.template deploy\
          copy README.md deploy\

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiosk_App
          path: deploy/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kiosk_App.exe
            .env.template
          generate_release_notes: true
          body: |
            ## Installation
            1. Download `Kiosk_App.exe` and `.env.template`
            2. Rename `.env.template` to `.env`
            3. Edit `.env` with your credentials
            4. Run `Kiosk_App.exe`
